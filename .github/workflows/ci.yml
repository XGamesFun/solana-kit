name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The programs the tests run, downloaded once per pinned set (public RPCs rate-limit).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: js/test/fixtures/**/*.so
          key: fixtures-${{ hashFiles('js/test/fixtures/pinned.txt') }}
      - run: npm run fixtures
      # fixtures, skill copies and release.json in step, lint (ESLint and Prettier), then the tests
      - run: npm run check
      - run: npm pack --dry-run

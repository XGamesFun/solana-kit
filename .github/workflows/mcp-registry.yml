name: MCP Registry

# The package's version in the MCP Registry, from server.json. Publish runs it after npm; run it by hand (Actions → MCP
# Registry → Run workflow) to list a version npm already has. Its name's namespace, io.github.XGamesFun, signs in as
# this repository's owner.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # the MCP Registry's GitHub sign-in

jobs:
  registry:
    runs-on: ubuntu-latest
    env:
      # The MCP Registry's publisher, pinned: change it on purpose, never to the mutable "latest".
      MCP_PUBLISHER_VERSION: v1.8.6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The registry checks the package on npm, which can take minutes to serve a new one.
      - name: Wait until npm serves this version
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          test "$(node -p "require('./server.json').version")" = "$version"
          spec="$(node -p "require('./package.json').name")@$version"
          for _ in $(seq 1 40); do
            if npm view "$spec" version > /dev/null 2>&1; then exit 0; fi
            sleep 15
          done
          echo "npm does not serve $spec after 10 minutes." >&2
          exit 1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

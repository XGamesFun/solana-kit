name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance, and the MCP Registry's GitHub sign-in

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24 ships npm 11, which publishes through npm's trusted publishing (OIDC).
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run fixtures
      - run: npm run check
      # The release's tag must be the package's version.
      - run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      # Skipped when npm has this version already, so a run that failed after it can be run again.
      - name: npm publish
        run: |
          if npm view "$(node -p "require('./package.json').name")@${GITHUB_REF_NAME#v}" version > /dev/null 2>&1; then
            echo "npm has ${GITHUB_REF_NAME#v} already."
          else
            npm publish
          fi
        env:
          # Only needed until the package has a trusted publisher on npmjs.com; with one, npm uses OIDC instead.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # The same version in the MCP Registry, once npm serves it.
  registry:
    needs: publish
    uses: ./.github/workflows/mcp-registry.yml
